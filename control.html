<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family:sans-serif; text-align:center; }
    #box {
      width:400px;
      height:400px;
      border:2px solid black;
      margin:auto;
      position:relative;
    }
    #lynx {
      width:80px;
      position:absolute;
      cursor:grab;
      left:100px;
      top:100px;
    }
  </style>
</head>
<body>

<h2>Control the Lynx 🐾</h2>

<div id="box">
  <img id="lynx" src="https://via.placeholder.com/80">
</div>

<button onclick="toggleHat()">Toggle Hat</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
  authDomain: "overlay-control-a2c56.firebaseapp.com",
  databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
  projectId: "overlay-control-a2c56",
  storageBucket: "overlay-control-a2c56.firebasestorage.app",
  messagingSenderId: "511339245584",
  appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let state = { x:100, y:100, hat:false };

const lynx = document.getElementById("lynx");
const box = document.getElementById("box");

lynx.onmousedown = () => {
  document.onmousemove = (e) => {
    let rect = box.getBoundingClientRect();

    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    // KEEP INSIDE BOX
    x = Math.max(0, Math.min(x, 320));
    y = Math.max(0, Math.min(y, 320));

    lynx.style.left = x + "px";
    lynx.style.top = y + "px";

    state.x = x;
    state.y = y;

    set(ref(db, "lynx"), state);
  };

  document.onmouseup = () => {
    document.onmousemove = null;
  };
};

window.toggleHat = () => {
  state.hat = !state.hat;
  set(ref(db, "lynx"), state);
};
</script>

</body>
</html>
