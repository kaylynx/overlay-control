<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { font-family:sans-serif; text-align:center; }
#box { width:960px; height:540px; border:2px solid black; margin:auto; position:relative; background:#eee; }
#lynx { width:80px; position:absolute; cursor:grab; left:0; top:0; }
button { margin:5px; }
input[type=range]{width:150px;}
</style>
</head>
<body>

<h2>Control the Lynx 🐾</h2>

<label>Password: <input id="passwordInput" type="password" placeholder="Enter password"></label>
<button id="loginBtn">Enter</button>
<p id="error" style="color:red;"></p>

<div id="controls" style="display:none;">
  <label>Your Name: <input id="name" placeholder="Viewer Name"></label>
  <div id="box">
    <img id="lynx" src="https://raw.githubusercontent.com/kaylynx/overlay-control/main/Kaylynx_Eevee.png">
  </div>

  <h3>Accessories</h3>
  <button onclick="toggle('hat')">Hat</button>
  <button onclick="toggle('glasses')">Glasses</button>
  <button onclick="toggle('coffee')">Coffee</button>

  <h3>Animations</h3>
  <button onclick="animate('blink')">Blink</button>
  <button onclick="animate('bounce')">Bounce</button>
  <button onclick="animate('wiggle')">Wiggle</button>
  <button onclick="animate('spin')">Spin</button>
  <button onclick="animate('zoomies')">Zoomies</button>

  <h3>Resize</h3>
  <label>Lynx: <input type="range" id="lynxSize" min="50" max="400" value="150"></label><br>
  <label>Hat: <input type="range" id="hatSize" min="30" max="150" value="80"></label><br>
  <label>Glasses: <input type="range" id="glassesSize" min="30" max="150" value="80"></label><br>
  <label>Coffee: <input type="range" id="coffeeSize" min="30" max="150" value="80"></label>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
  authDomain: "overlay-control-a2c56.firebaseapp.com",
  databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
  projectId: "overlay-control-a2c56",
  storageBucket: "overlay-control-a2c56.firebasestorage.app",
  messagingSenderId: "511339245584",
  appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let state = {
  x:0, y:0, lynxWidth:150,
  hat:false, hatWidth:80,
  glasses:false, glassesWidth:80,
  coffee:false, coffeeWidth:80,
  blink:false, bounce:false, wiggle:false, spin:false, zoomies:false,
  controller:""
};

const PASSWORD = "yourpassword123";
const loginBtn = document.getElementById("loginBtn");
const passwordInput = document.getElementById("passwordInput");
const controlsDiv = document.getElementById("controls");
const errorEl = document.getElementById("error");

loginBtn.onclick = () => {
  if(passwordInput.value === PASSWORD){
    controlsDiv.style.display = "block";
    passwordInput.style.display = "none";
    loginBtn.style.display = "none";
    errorEl.innerText = "";
  } else { errorEl.innerText = "Incorrect password!"; }
};

const lynx = document.getElementById("lynx");
const box = document.getElementById("box");
const nameInput = document.getElementById("name");

const overlayWidth = 1920;
const overlayHeight = 1080;
const controlBoxWidth = 960;
const controlBoxHeight = 540;
const scaleX = overlayWidth / controlBoxWidth;
const scaleY = overlayHeight / controlBoxHeight;

// Dragging
lynx.onmousedown = () => {
  document.onmousemove = (e) => {
    let rect = box.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;
    x = Math.max(0, Math.min(x, controlBoxWidth - lynx.offsetWidth));
    y = Math.max(0, Math.min(y, controlBoxHeight - lynx.offsetHeight));
    lynx.style.left = x + "px";
    lynx.style.top = y + "px";
    state.x = x * scaleX;
    state.y = y * scaleY;
    state.controller = nameInput.value || "Anonymous";
    set(ref(db,"lynx"), state);
  };
  document.onmouseup = () => { document.onmousemove = null; };
};

// Toggle accessories
function toggle(item){ state[item]=!state[item]; state.controller=nameInput.value||"Anonymous"; set(ref(db,"lynx"),state); }

// Animations
function animate(action){ state[action]=true; state.controller=nameInput.value||"Anonymous"; set(ref(db,"lynx"),state);
  setTimeout(()=>{state[action]=false; set(ref(db,"lynx"),state);},500);
}

// Resize
function updateSize(name,val){ state[name]=parseInt(val); state.controller=nameInput.value||"Anonymous"; set(ref(db,"lynx"),state); }
document.getElementById("lynxSize").oninput = e=>updateSize("lynxWidth",e.target.value);
document.getElementById("hatSize").oninput = e=>updateSize("hatWidth",e.target.value);
document.getElementById("glassesSize").oninput = e=>updateSize("glassesWidth",e.target.value);
document.getElementById("coffeeSize").oninput = e=>updateSize("coffeeWidth",e.target.value);

</script>
</body>
</html>
