<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; overflow:hidden; background:transparent; }
  #lynx { position:absolute; left:0; top:0; width:150px; transition: all 0.2s; }
  #hat, #glasses, #coffee { position:absolute; display:none; transition: all 0.2s; }
  #controllerName {
    position:absolute;
    top:10px;
    left:10px;
    font-family:sans-serif;
    font-size:18px;
    color:#fff;
    text-shadow: 1px 1px 3px #000;
  }
</style>
</head>
<body>

<div id="controllerName"></div>
<img id="lynx" src="https://raw.githubusercontent.com/kaylynx/overlay-control/main/Kaylynx_Eevee.png">
<img id="hat" src="https://raw.githubusercontent.com/kaylynx/overlay-control/main/Hat.png">
<img id="glasses" src="https://raw.githubusercontent.com/kaylynx/overlay-control/main/Glasses.png">
<img id="coffee" src="https://raw.githubusercontent.com/kaylynx/overlay-control/main/Coffee.png">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
  authDomain: "overlay-control-a2c56.firebaseapp.com",
  databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
  projectId: "overlay-control-a2c56",
  storageBucket: "overlay-control-a2c56.firebasestorage.app",
  messagingSenderId: "511339245584",
  appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const lynx = document.getElementById("lynx");
const hat = document.getElementById("hat");
const glasses = document.getElementById("glasses");
const coffee = document.getElementById("coffee");
const controllerNameEl = document.getElementById("controllerName");

onValue(ref(db, "lynx"), (snapshot) => {
  const data = snapshot.val();
  if (!data) return;

  // Position
  lynx.style.left = data.x + "px";
  lynx.style.top = data.y + "px";

  hat.style.left = (data.x + 30) + "px";
  hat.style.top = (data.y - 40) + "px";
  hat.style.display = data.hat ? "block" : "none";

  glasses.style.left = (data.x + 20) + "px";
  glasses.style.top = (data.y + 20) + "px";
  glasses.style.display = data.glasses ? "block" : "none";

  coffee.style.left = (data.x - 20) + "px";
  coffee.style.top = (data.y + 80) + "px";
  coffee.style.display = data.coffee ? "block" : "none";

  // Size
  if(data.lynxWidth) lynx.style.width = data.lynxWidth + "px";
  if(data.hatWidth) hat.style.width = data.hatWidth + "px";
  if(data.glassesWidth) glasses.style.width = data.glassesWidth + "px";
  if(data.coffeeWidth) coffee.style.width = data.coffeeWidth + "px";

  // Controller name
  controllerNameEl.innerText = data.controller || "";

  // Animations
  if(data.blink){ lynx.style.transform="scaleY(0.1)"; setTimeout(()=>lynx.style.transform="scaleY(1)",200); }
  if(data.bounce){ lynx.style.transform="translateY(-20px)"; setTimeout(()=>lynx.style.transform="translateY(0)",200); }
  if(data.wiggle){ lynx.style.transform="rotate(10deg)"; setTimeout(()=>lynx.style.transform="rotate(-10deg)",100); setTimeout(()=>lynx.style.transform="rotate(0deg)",200); }
  if(data.spin){ lynx.style.transform="rotate(360deg)"; setTimeout(()=>lynx.style.transform="rotate(0deg)",500); }
  if(data.zoomies){ lynx.style.left=(data.x+Math.random()*50-25)+"px"; lynx.style.top=(data.y+Math.random()*50-25)+"px"; }
});
</script>
</body>
</html>
