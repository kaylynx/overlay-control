<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin:0; overflow:hidden; background:transparent; }
        #overlay-container { width: 100vw; height: 100vh; position: relative; }
        .user-item { position: absolute; transform: translate(-50%, -50%); }
        .name-tag { 
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #00ffcc; padding: 2px 10px; 
            border-radius: 4px; font-family: sans-serif; font-size: 14px; white-space: nowrap;
        }
        #drawLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
    </style>
</head>
<body>
    <div id="overlay-container"><canvas id="drawLayer"></canvas></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
    authDomain: "overlay-control-a2c56.firebaseapp.com",
    databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
    projectId: "overlay-control-a2c56",
    storageBucket: "overlay-control-a2c56.firebasestorage.app",
    messagingSenderId: "511339245584",
    appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const container = document.getElementById('overlay-container');
const canvas = document.getElementById('drawLayer');
const ctx = canvas.getContext('2d');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();

const sounds = {
    meow: new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3'),
    boing: new Audio('https://assets.mixkit.co/active_storage/sfx/1344/1344-preview.mp3')
};

onValue(ref(db, "lynxSessions"), (snap) => {
    document.querySelectorAll('.user-item').forEach(e => e.remove());
    const data = snap.val() || {};
    Object.values(data).forEach(session => {
        if (!session.items) return;
        Object.entries(session.items).forEach(([id, item]) => {
            const div = document.createElement('div');
            div.className = 'user-item';
            div.style.left = item.x + "%"; div.style.top = item.y + "%";
            div.style.zIndex = item.z || 10;
            const img = document.createElement('img');
            img.src = item.src;
            img.style.width = item.w + "vw";
            img.style.transform = `scaleX(${item.flip || 1})`;
            const name = document.createElement('div');
            name.className = 'name-tag';
            name.innerText = session.controller || "";
            div.appendChild(name); div.appendChild(img); container.appendChild(div);
        });
    });
});

onValue(ref(db, 'drawings'), (snap) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const data = snap.val();
    if(!data) return;
    Object.values(data).forEach(line => {
        ctx.strokeStyle = line.color;
        ctx.lineWidth = (line.width / 100) * canvas.width;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo((line.x1 / 100) * canvas.width, (line.y1 / 100) * canvas.height);
        ctx.lineTo((line.x2 / 100) * canvas.width, (line.y2 / 100) * canvas.height);
        ctx.stroke();
    });
});

onChildAdded(ref(db, 'triggers'), (snapshot) => {
    const trigger = snapshot.val();
    if (Date.now() - trigger.time < 2000) {
        const s = sounds[trigger.type];
        if (s) { s.currentTime = 0; s.play().catch(e => console.log("Click overlay to enable sound")); }
    }
});
</script>
</body>
</html>
