<!-- ... keep your same head/styles ... -->
<div id="sidebar">
    <!-- ... same closet ... -->

    <h3>Admin Tools</h3>
    <div class="btn-grid">
        <button onclick="clearAllAccessories()" style="grid-column: span 2; background: #822;">☢️ Nuke All Accessories</button>
        <button onclick="clearDrawings()" style="grid-column: span 2; background: #611;">Reset Whiteboard</button>
    </div>

    <h3>Pen Settings</h3>
    <div style="margin-bottom:10px;">
        <div class="color-circle" style="background:#ff00ff" onclick="setPenColor('#ff00ff')"></div>
        <div class="color-circle" style="background:#00ffcc" onclick="setPenColor('#00ffcc')"></div>
        <div class="color-circle" style="background:#ffff00" onclick="setPenColor('#ffff00')"></div>
        <input type="color" id="customColor" onchange="setPenColor(this.value)">
    </div>
    <label style="font-size:12px;">Pen Size: <input type="range" id="penWidth" min="1" max="40" value="10" style="width:100%"></label>
    
    <div class="btn-grid" style="margin-top:15px;">
        <button id="penBtn" onclick="setMode('pen')">🖌️ Draw</button>
        <button id="moveBtn" onclick="setMode('move')" class="active">🖱️ Move</button>
    </div>
    <!-- ... same sounds ... -->
</div>

<script type="module">
// ... same firebase imports and config ...

// NEW ADMIN FUNCTIONS
window.clearAllAccessories = () => {
    if(confirm("This will remove EVERY accessory from the screen. Continue?")) {
        remove(ref(db, 'lynxSessions'));
        sessionData.items = {}; // Clear local session too
        render();
    }
};

window.clearDrawings = () => { remove(ref(db, 'drawings')); };

// UPDATED DRAWING LOGIC
window.onmousemove = (e) => {
    if(!isDrawing || mode !== 'pen') return;
    const rect = box.getBoundingClientRect();
    const currentPoint = { 
        x: ((e.clientX - rect.left) / rect.width) * 100, 
        y: ((e.clientY - rect.top) / rect.height) * 100 
    };
    
    // We send the width as a percentage of the box width
    const normalizedWidth = (document.getElementById('penWidth').value / rect.width) * 100;

    push(ref(db, 'drawings'), { 
        x1: lastPoint.x, y1: lastPoint.y, 
        x2: currentPoint.x, y2: currentPoint.y, 
        color: currentPenColor,
        width: normalizedWidth 
    });
    
    lastPoint = currentPoint;
};
// ... rest of your script ...
</script>
