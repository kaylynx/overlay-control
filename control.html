<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lynx Super Controller</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 300px; background: #2c2c2c; padding: 15px; overflow-y: auto; border-right: 2px solid #444; }
        #main-stage { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #box { 
            width: 960px; height: 540px; border: 2px solid #555; 
            position: relative; background: #333; overflow: hidden;
        }
        
        .draggable { position: absolute; cursor: move; }
        .selected { outline: 2px solid #00ffcc; z-index: 1000; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        button { padding: 8px; cursor: pointer; background: #444; color: white; border: 1px solid #666; border-radius: 4px; }
        button:hover { background: #555; }
        .sound-btn { background: #2e4a3e; }
        .draw-btn { background: #4a2e2e; }
        
        #edit-panel { background: #333; padding: 10px; width: 940px; display: flex; gap: 20px; align-items: center; border-top: 1px solid #444;}
        #login-screen { position: fixed; inset: 0; background: #1a1a1a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2>🐾 Enter Password</h2>
    <input id="passwordInput" type="password" style="padding:10px; margin-bottom:10px;">
    <button id="loginBtn" style="width:100px;">Enter</button>
</div>

<div id="sidebar">
    <h3>Closet</h3>
    <div class="btn-grid" id="accessory-list"></div>
    
    <h3>Soundboard</h3>
    <div class="btn-grid">
        <button class="sound-btn" onclick="playSound('meow')">Meow</button>
        <button class="sound-btn" onclick="playSound('boing')">Boing</button>
    </div>

    <h3>Canvas</h3>
    <button class="draw-btn" onclick="clearWhiteboard()" style="width:100%">Clear All Drawings</button>
</div>

<div id="main-stage">
    <input id="userName" placeholder="Enter your name" style="margin-bottom:10px; padding:8px; width:300px;">
    <div id="box">
        <canvas id="whiteboard" width="960" height="540" style="position:absolute; top:0; left:0; z-index:1; pointer-events:none;"></canvas>
    </div>

    <div id="edit-panel">
        <div>
            Size: <input type="range" id="sizeSlider" min="50" max="600" value="150">
        </div>
        <button onclick="toggleFlip()">Flip ↔️</button>
        <button onclick="bringToFront()">Bring to Front 🔝</button>
        <button onclick="removeItem()" style="background:#8b0000">Remove Item</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, update, onValue, push } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
    authDomain: "overlay-control-a2c56.firebaseapp.com",
    databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
    projectId: "overlay-control-a2c56",
    storageBucket: "overlay-control-a2c56.firebasestorage.app",
    messagingSenderId: "511339245584",
    appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const sessionId = "user_" + Math.random().toString(36).substr(2,9);
const baseUrl = "https://raw.githubusercontent.com/kaylynx/overlay-control/main/";

const files = ['Kaylynx_Eevee.png', '8bit.png', 'aviators.png', 'blackheart.png', 'cateye.png', 'cowboy.png', 'jester.png', 'party.png', 'pinkheart.png', 'pirate.png', 'santa.png', 'shades.png', 'sunhat.png', 'witch.png'];

let sessionData = { controller: "Anonymous", items: {} };
let selectedId = null;
let maxZ = 10;

// Populate Buttons
const list = document.getElementById('accessory-list');
files.forEach(file => {
    const btn = document.createElement('button');
    btn.innerText = file.replace('.png', '');
    btn.onclick = () => addItem(baseUrl + file);
    list.appendChild(btn);
});

// Login
document.getElementById('loginBtn').onclick = () => {
    if(document.getElementById('passwordInput').value === "yourpassword123") {
        document.getElementById('login-screen').style.display = "none";
    }
};

window.addItem = (url) => {
    const id = "item_" + Date.now();
    sessionData.items[id] = { src: url, x: 200, y: 200, w: 150, flip: 1, z: ++maxZ };
    sessionData.controller = document.getElementById('userName').value || "Guest";
    sync(); render();
};

window.removeItem = () => { if(selectedId) { delete sessionData.items[selectedId]; selectedId = null; sync(); render(); }};

window.toggleFlip = () => { if(selectedId) { sessionData.items[selectedId].flip *= -1; sync(); render(); }};

window.bringToFront = () => { if(selectedId) { sessionData.items[selectedId].z = ++maxZ; sync(); render(); }};

window.playSound = (type) => { push(ref(db, 'triggers'), { type: type, time: Date.now() }); };

function sync() { set(ref(db, `lynxSessions/${sessionId}`), sessionData); }

function render() {
    const box = document.getElementById('box');
    // Remove only images
    box.querySelectorAll('.draggable').forEach(n => n.remove());
    
    Object.entries(sessionData.items).forEach(([id, data]) => {
        const img = document.createElement('img');
        img.src = data.src;
        img.className = "draggable" + (selectedId === id ? " selected" : "");
        img.style.left = (data.x / 2) + "px";
        img.style.top = (data.y / 2) + "px";
        img.style.width = (data.w / 2) + "px";
        img.style.transform = `scaleX(${data.flip})`;
        img.style.zIndex = data.z;

        img.onmousedown = (e) => {
            selectedId = id;
            let startX = e.clientX - img.offsetLeft;
            let startY = e.clientY - img.offsetTop;
            document.onmousemove = (ev) => {
                sessionData.items[id].x = (ev.clientX - startX) * 2;
                sessionData.items[id].y = (ev.clientY - startY) * 2;
                render();
            };
            document.onmouseup = () => { document.onmousemove = null; sync(); };
        };
        box.appendChild(img);
    });
}

document.getElementById('sizeSlider').oninput = (e) => {
    if(selectedId) { sessionData.items[selectedId].w = e.target.value; render(); }
};
document.getElementById('sizeSlider').onchange = () => sync();
</script>
</body>
</html>
