<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body { margin:0; overflow:hidden; background:transparent; }
    #canvas { width: 1920px; height: 1080px; position: relative; }
    .item-wrapper { position: absolute; transition: transform 0.1s linear; }
    .name-tag {
        position: absolute; top: -25px; left: 0;
        background: rgba(0,0,0,0.6); color: white;
        padding: 2px 8px; border-radius: 4px; font-family: sans-serif;
        font-size: 14px; white-space: nowrap;
    }
</style>
</head>
<body>
<div id="canvas"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
    authDomain: "overlay-control-a2c56.firebaseapp.com",
    databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
    projectId: "overlay-control-a2c56",
    storageBucket: "overlay-control-a2c56.firebasestorage.app",
    messagingSenderId: "511339245584",
    appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const canvas = document.getElementById("canvas");

onValue(ref(db, "lynxSessions"), (snapshot) => {
    canvas.innerHTML = ""; // Clear and redraw
    const allSessions = snapshot.val() || {};

    Object.entries(allSessions).forEach(([userId, sessionData]) => {
        if (!sessionData.items) return;

        Object.entries(sessionData.items).forEach(([itemId, item]) => {
            const wrapper = document.createElement("div");
            wrapper.className = "item-wrapper";
            wrapper.style.left = item.x + "px";
            wrapper.style.top = item.y + "px";

            const img = document.createElement("img");
            img.src = item.src;
            img.style.width = item.w + "px";

            const name = document.createElement("div");
            name.className = "name-tag";
            name.innerText = sessionData.controller;

            wrapper.appendChild(name);
            wrapper.appendChild(img);
            canvas.appendChild(wrapper);
        });
    });
});
</script>
</body>
</html>
