<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lynx Super Controller: Chaos Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        #sidebar { width: 320px; background: #2c2c2c; padding: 15px; overflow-y: auto; border-right: 2px solid #444; z-index: 10; }
        #main-stage { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; position: relative; }
        #box-container { width: 85%; max-width: 960px; aspect-ratio: 16 / 9; position: relative; border: 2px solid #555; background: #333; }
        #box { width: 100%; height: 100%; position: relative; overflow: hidden; cursor: crosshair; }
        .draggable { position: absolute; cursor: move; transform: translate(-50%, -50%); transform-origin: center; }
        .selected { outline: 2px solid #00ffcc; z-index: 1000 !important; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        button { padding: 8px; cursor: pointer; background: #444; color: white; border: 1px solid #666; border-radius: 4px; font-size: 10px; text-transform: capitalize; }
        button:hover { background: #555; }
        button.active { background: #00ffcc; color: #000; font-weight: bold; }
        #admin-section { display: none; background: #3a1a1a; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #f44; }
        .color-circle { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; display: inline-block; margin: 2px; }
        #edit-panel { background: #222; padding: 15px; width: 100%; display: flex; gap: 20px; align-items: center; border-top: 1px solid #444; justify-content: center; position: absolute; bottom: 0; }
        #login-screen { position: fixed; inset: 0; background: #1a1a1a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .stat-box { background: #222; padding: 5px 10px; border-radius: 5px; border: 1px solid #444; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2 style="color:#00ffcc">🐾 Enter the Den</h2>
    <input id="passwordInput" type="password" placeholder="Password" style="padding:10px; border-radius:5px;">
    <button id="loginBtn" style="margin-top:15px; width:120px; background:#00ffcc; color:#000;">Enter</button>
</div>

<div id="sidebar">
    <div id="admin-section">
        <h3 style="color:#ff4444; margin-top:0;">Admin Chaos</h3>
        <button onclick="triggerEffect('screenshake')" style="width:100%; background:#f80; margin-bottom:5px;">🫨 Screenshake</button>
        <button onclick="triggerEffect('party')" style="width:100%; background:#f0f; margin-bottom:5px;">🎉 Party Mode</button>
        <button onclick="toggleRainbow()" id="rainbowBtn" style="width:100%; background:#444; margin-bottom:5px;">🌈 Rainbow Mode: OFF</button>
        <hr style="border:0; border-top:1px solid #622;">
        <button onclick="clearAllAccessories()" style="width:100%; background:#822; margin-bottom:5px;">☢️ Nuke All Items</button>
        <button onclick="clearDrawings()" style="width:100%; background:#611;">Reset Whiteboard</button>
    </div>

    <div class="stat-box">
        ❤️ Total Pets: <span id="petCountDisplay" style="color:#00ffcc; font-weight:bold;">0</span>
    </div>

    <h3>Closet</h3>
    <div class="btn-grid" id="accessory-list"></div>

    <h3>Pen & Tools</h3>
    <div>
        <div class="color-circle" style="background:#ff00ff" onclick="setPenColor('#ff00ff')"></div>
        <div class="color-circle" style="background:#00ffcc" onclick="setPenColor('#00ffcc')"></div>
        <div class="color-circle" style="background:#ffff00" onclick="setPenColor('#ffff00')"></div>
        <input type="color" id="customColor" onchange="setPenColor(this.value)" style="width:25px; height:25px; vertical-align:middle;">
    </div>
    <label style="font-size:11px;">Pen Size: <input type="range" id="penWidth" min="1" max="25" value="8" style="width:100%"></label>
    
    <div class="btn-grid" style="margin-top:10px;">
        <button id="penBtn" onclick="setMode('pen')">🖌️ Draw</button>
        <button id="moveBtn" onclick="setMode('move')" class="active">🖱️ Move</button>
        <button id="bonkBtn" onclick="setMode('bonk')">🔨 Bonk!</button>
        <button onclick="petTheLynx()" style="background:#522;">❤️ Pet Lynx</button>
        <button onclick="undoDrawing()" style="grid-column: span 2; background: #333;">↩️ Undo Last Stroke</button>
    </div>

    <h3>Soundboard</h3>
    <div class="btn-grid" id="sound-grid"></div>
</div>

<div id="main-stage">
    <div style="margin-bottom:10px; text-align:center;">
        <input id="userName" placeholder="Twitch Name..." style="padding:8px; background:#222; border:1px solid #444; color:white; border-radius:5px;">
    </div>
    <div id="box-container">
        <div id="box">
            <canvas id="drawingCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>
        </div>
    </div>
    <div id="edit-panel">
        <button onclick="toggleFlip()">Flip ↔️</button>
        <button onclick="bringToFront()">Bring to Front 🔝</button>
        <div id="resize-container" style="display:none; align-items:center; gap:10px;">
            <label style="font-size:11px;">Size:</label>
            <input type="range" id="itemSizeSlider" min="5" max="50" oninput="resizeItem(this.value)">
        </div>
        <button onclick="removeItem()" style="background:#8b0000;">Remove Selected</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, push, remove, query, limitToLast, get, update, increment } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
    authDomain: "overlay-control-a2c56.firebaseapp.com",
    databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
    projectId: "overlay-control-a2c56",
    storageBucket: "overlay-control-a2c56.firebasestorage.app",
    messagingSenderId: "511339245584",
    appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const sessionId = "user_" + Math.random().toString(36).substr(2,9);
const baseUrl = "https://raw.githubusercontent.com/kaylynx/overlay-control/main/";

const files = ['Kaylynx_Eevee.png', '8bit.png', 'aviators.png', 'blackheart.png', 'cateye.png', 'cowboy.png', 'jester.png', 'party.png', 'pinkheart.png', 'pirate.png', 'santa.png', 'shades.png', 'sunhat.png', 'witch.png'];
const soundMap = {
    "crab-rave-(copy)-made-with-Voicemod.mp3": "Crab Rave",
    "turn-the-lights-off-v2--short-made-with-Voicemod.mp3": "Lights Off",
    "whatcha-say-_short_-(hide-and-seek-made-with-Voicemod.mp3": "Whatcha Say",
    "two-hours-later-(spongebob)-quicksounds-made-with-Voicemod.mp3": "2 Hours Later",
    "star-wars-cantina-made-with-Voicemod.mp3": "Star Wars",
    "bruh-made-with-Voicemod.mp3": "Bruh",
    "navi-hey-made-with-Voicemod.mp3": "Navi Hey",
    "meow-deep-made-with-Voicemod.mp3": "Deep Meow",
    "roblox-bye-wave-made-with-Voicemod.mp3": "Roblox Bye",
    "emotional-damage-made-with-Voicemod.mp3": "Emo Damage",
    "lizard-made-with-Voicemod.mp3": "Lizard",
    "tickles-my-balls-made-with-Voicemod.mp3": "Tickles",
    "objection!-made-with-Voicemod.mp3": "Objection!",
    "correct!-made-with-Voicemod.mp3": "Correct!"
};

let sessionData = { controller: "Anonymous", items: {} };
let selectedId = null;
let mode = 'move'; 
let isDrawing = false;
let currentPenColor = '#ff00ff';
let lastPoint = null;
let rainbowActive = false;

document.getElementById('loginBtn').onclick = () => {
    const pass = document.getElementById('passwordInput').value;
    if(pass === "admin123") document.getElementById('admin-section').style.display = "block";
    document.getElementById('login-screen').style.display = "none";
};

const accessoryList = document.getElementById('accessory-list');
files.forEach(f => {
    const b = document.createElement('button');
    b.innerText = f.split('.')[0].replace(/_/g, ' ');
    b.onclick = () => addItem(baseUrl + f);
    accessoryList.appendChild(b);
});

const soundGrid = document.getElementById('sound-grid');
Object.entries(soundMap).forEach(([file, label]) => {
    const b = document.createElement('button');
    b.innerText = label;
    b.onclick = () => push(ref(db, 'triggers'), { type: 'sound', file: file, time: Date.now() });
    soundGrid.appendChild(b);
});

window.triggerEffect = (name) => push(ref(db, 'effects/events'), { name: name, time: Date.now() });
window.toggleRainbow = () => {
    rainbowActive = !rainbowActive;
    set(ref(db, 'effects/rainbow'), rainbowActive);
    document.getElementById('rainbowBtn').innerText = `🌈 Rainbow Mode: ${rainbowActive ? 'ON' : 'OFF'}`;
};
window.petTheLynx = () => {
    update(ref(db, 'stats'), { pets: increment(1) });
    push(ref(db, 'effects/events'), { name: 'headpat', targetSession: sessionId, time: Date.now() });
};
onValue(ref(db, 'stats/pets'), (snap) => { document.getElementById('petCountDisplay').innerText = snap.val() || 0; });

window.addItem = (url) => {
    const nameInput = document.getElementById('userName');
    if(!nameInput.value.trim()) { alert("Enter your name first!"); return; }
    nameInput.disabled = true; nameInput.style.opacity = "0.5";
    const id = "item_" + Date.now();
    sessionData.items[id] = { src: url, x: 50, y: 50, w: 15, flip: 1, z: 10 };
    sessionData.controller = nameInput.value;
    sync();
};

window.removeItem = () => { if(selectedId) { delete sessionData.items[selectedId]; selectedId = null; document.getElementById('resize-container').style.display='none'; sync(); }};
window.resizeItem = (val) => { if(selectedId) { sessionData.items[selectedId].w = val; sync(); }};
window.toggleFlip = () => { if(selectedId) { sessionData.items[selectedId].flip *= -1; sync(); }};
window.bringToFront = () => { if(selectedId) { 
    const maxZ = Math.max(...Object.values(sessionData.items).map(i => i.z || 0), 10);
    sessionData.items[selectedId].z = maxZ + 1; sync(); 
}};

window.clearAllAccessories = () => { if(confirm("Nuke ALL items?")) remove(ref(db, 'lynxSessions')); };
window.clearDrawings = () => { if(confirm("Clear whiteboard?")) remove(ref(db, 'drawings')); };
window.undoDrawing = async () => {
    const lastQuery = query(ref(db, 'drawings'), limitToLast(12));
    const snapshot = await get(lastQuery);
    if (snapshot.exists()) {
        const updates = {};
        snapshot.forEach(child => { updates[child.key] = null; });
        update(ref(db, 'drawings'), updates);
    }
};

window.setMode = (m) => { 
    mode = m; 
    document.getElementById('penBtn').className = m === 'pen' ? 'active' : ''; 
    document.getElementById('moveBtn').className = m === 'move' ? 'active' : ''; 
    document.getElementById('bonkBtn').className = m === 'bonk' ? 'active' : ''; 
};
window.setPenColor = (c) => { currentPenColor = c; };

function sync() { set(ref(db, `lynxSessions/${sessionId}`), sessionData); }

const canvas = document.getElementById('drawingCanvas');
const ctx = canvas.getContext('2d');
const box = document.getElementById('box');
function resizeCanvas() { canvas.width = box.clientWidth; canvas.height = box.clientHeight; }
window.addEventListener('resize', resizeCanvas); resizeCanvas();

box.onmousedown = (e) => { 
    if(mode === 'pen') { 
        isDrawing = true; 
        const rect = box.getBoundingClientRect(); 
        lastPoint = { x: ((e.clientX - rect.left) / rect.width) * 100, y: ((e.clientY - rect.top) / rect.height) * 100 }; 
    }
};

window.onmousemove = (e) => {
    if(!isDrawing || mode !== 'pen') return;
    const rect = box.getBoundingClientRect();
    const currentPoint = { x: ((e.clientX - rect.left) / rect.width) * 100, y: ((e.clientY - rect.top) / rect.height) * 100 };
    push(ref(db, 'drawings'), { x1: lastPoint.x, y1: lastPoint.y, x2: currentPoint.x, y2: currentPoint.y, color: currentPenColor, width: (document.getElementById('penWidth').value / rect.width) * 100 });
    lastPoint = currentPoint;
};
window.onmouseup = () => { isDrawing = false; };

onValue(ref(db, `lynxSessions/${sessionId}`), (snap) => {
    sessionData = snap.val() || { controller: "Anonymous", items: {} };
    render();
});

onValue(ref(db, 'drawings'), (snap) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const data = snap.val(); if(!data) return;
    Object.values(data).forEach(line => {
        ctx.strokeStyle = line.color; ctx.lineWidth = (line.width / 100) * canvas.width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo((line.x1 / 100) * canvas.width, (line.y1 / 100) * canvas.height);
        ctx.lineTo((line.x2 / 100) * canvas.width, (line.y2 / 100) * canvas.height); ctx.stroke();
    });
});

function render() {
    box.querySelectorAll('.draggable').forEach(n => n.remove());
    Object.entries(sessionData.items).forEach(([id, data]) => {
        const img = document.createElement('img');
        img.src = data.src; img.className = "draggable" + (selectedId === id ? " selected" : "");
        img.style.left = data.x + "%"; img.style.top = data.y + "%"; img.style.width = data.w + "%";
        img.style.zIndex = data.z; img.style.transform = `translate(-50%, -50%) scaleX(${data.flip})`;
        img.onmousedown = (e) => {
            e.stopPropagation();
            if(mode === 'bonk') {
                push(ref(db, 'triggers'), { type: 'bonk', targetId: id, time: Date.now() });
                return;
            }
            if(mode !== 'move') return;
            selectedId = id; document.getElementById('resize-container').style.display = 'flex';
            document.getElementById('itemSizeSlider').value = data.w;
            document.onmousemove = (ev) => {
                const rect = box.getBoundingClientRect();
                sessionData.items[id].x = Math.max(0, Math.min(100, ((ev.clientX - rect.left) / rect.width) * 100));
                sessionData.items[id].y = Math.max(0, Math.min(100, ((ev.clientY - rect.top) / rect.height) * 100));
                render();
            };
            document.onmouseup = () => { document.onmousemove = null; sync(); };
            render();
        };
        box.appendChild(img);
    });
}
</script>
</body>
</html>
