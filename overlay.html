<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin:0; overflow:hidden; background:transparent; }
        #canvas-wrap { width: 1920px; height: 1080px; position: relative; }
        .item { position: absolute; transition: transform 0.1s linear; }
        .name { 
            position: absolute; top: -30px; left: 0; background: rgba(0,0,0,0.7); 
            color: white; padding: 4px 10px; border-radius: 5px; font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="canvas-wrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
    authDomain: "overlay-control-a2c56.firebaseapp.com",
    databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
    projectId: "overlay-control-a2c56",
    storageBucket: "overlay-control-a2c56.firebasestorage.app",
    messagingSenderId: "511339245584",
    appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const wrap = document.getElementById('canvas-wrap');

// SOUND ASSETS (Replace these with your actual links)
const sounds = {
    meow: new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3'),
    boing: new Audio('https://assets.mixkit.co/active_storage/sfx/1344/1344-preview.mp3')
};

// Item Update Loop
onValue(ref(db, "lynxSessions"), (snapshot) => {
    wrap.innerHTML = "";
    const data = snapshot.val() || {};
    Object.values(data).forEach(session => {
        if (!session.items) return;
        Object.entries(session.items).forEach(([id, item]) => {
            const el = document.createElement('div');
            el.className = 'item';
            el.style.left = item.x + 'px';
            el.style.top = item.y + 'px';
            el.style.zIndex = item.z || 1;

            const img = document.createElement('img');
            img.src = item.src;
            img.style.width = item.w + "px";
            img.style.transform = `scaleX(${item.flip || 1})`;

            const name = document.createElement('div');
            name.className = 'name';
            name.innerText = session.controller;

            el.appendChild(name);
            el.appendChild(img);
            wrap.appendChild(el);
        });
    });
});

// Sound Trigger Loop
onChildAdded(ref(db, 'triggers'), (snapshot) => {
    const trigger = snapshot.val();
    // Only play if trigger is brand new (within last 2 seconds)
    if (Date.now() - trigger.time < 2000) {
        if (sounds[trigger.type]) {
            sounds[trigger.type].currentTime = 0;
            sounds[trigger.type].play();
        }
    }
});
</script>
</body>
</html>
