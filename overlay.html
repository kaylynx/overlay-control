<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin:0; overflow:hidden; background:transparent; }
.lynx-wrapper { position:absolute; transition: all 0.1s linear; }
.lynx-img { position:absolute; top:0; left:0; }
.controllerName {
  position:absolute; top:-20px; left:0;
  font-family:sans-serif; font-size:16px; color:white; text-shadow:1px 1px 3px #000;
}
</style>
</head>
<body>
<div id="overlay"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
  authDomain: "overlay-control-a2c56.firebaseapp.com",
  databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
  projectId: "overlay-control-a2c56",
  storageBucket: "overlay-control-a2c56.firebasestorage.app",
  messagingSenderId: "511339245584",
  appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const overlay = document.getElementById("overlay");
const sessions = {}; // Tracks each viewer's Lynx

onValue(ref(db,"lynxSessions"), snapshot => {
  const data = snapshot.val() || {};
  console.log("Overlay received data:", data);

  // Remove sessions that no longer exist
  Object.keys(sessions).forEach(id => {
    if (!data[id]) {
      overlay.removeChild(sessions[id].wrapper);
      delete sessions[id];
    }
  });

  // Update/create sessions
  Object.entries(data).forEach(([id, userData]) => {
    let wrapper = sessions[id]?.wrapper;
    if(!wrapper){
      wrapper = document.createElement("div");
      wrapper.className = "lynx-wrapper";

      const img = document.createElement("img");
      img.className = "lynx-img";
      img.src = "https://raw.githubusercontent.com/kaylynx/overlay-control/main/Kaylynx_Eevee.png";
      
      const nameEl = document.createElement("div");
      nameEl.className = "controllerName";
      
      wrapper.appendChild(nameEl);
      wrapper.appendChild(img);
      overlay.appendChild(wrapper);

      sessions[id] = { wrapper, img, nameEl };
    }

    // Position
    wrapper.style.left = userData.x + "px";
    wrapper.style.top = userData.y + "px";

    // Size
    sessions[id].img.style.width = userData.lynxWidth + "px";

    // Name
    sessions[id].nameEl.innerText = userData.controller || "";
  });
});
</script>
</body>
</html>
