<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body { margin:0; overflow:hidden; background:transparent; }
.lynx-wrapper { position:absolute; transition: all 0.2s ease; }
.lynx-img { position:absolute; top:0; left:0; }
.controllerName {
  position:absolute; top:-20px; left:0;
  font-family:sans-serif; font-size:16px; color:white; text-shadow:1px 1px 3px #000;
}
</style>
</head>
<body>
<div id="overlay"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhf8FpATvr1i4qQiLVsDIByzWk7cREBag",
  authDomain: "overlay-control-a2c56.firebaseapp.com",
  databaseURL: "https://overlay-control-a2c56-default-rtdb.firebaseio.com",
  projectId: "overlay-control-a2c56",
  storageBucket: "overlay-control-a2c56.firebasestorage.app",
  messagingSenderId: "511339245584",
  appId: "1:511339245584:web:2eaa1a535d438e847b5a95"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const overlay = document.getElementById("overlay");

const sessions = {}; // Keep track of Lynx elements per user

onValue(ref(db,"lynxSessions"), snapshot => {
  const data = snapshot.val() || {};

  // Remove deleted sessions
  Object.keys(sessions).forEach(id=>{
    if(!data[id]) overlay.removeChild(sessions[id].wrapper), delete sessions[id];
  });

  Object.entries(data).forEach(([id, userData])=>{
    let wrapper = sessions[id]?.wrapper;
    if(!wrapper){
      wrapper = document.createElement("div");
      wrapper.className="lynx-wrapper";
      const img = document.createElement("img"); img.className="lynx-img"; img.src="https://raw.githubusercontent.com/kaylynx/overlay-control/main/Kaylynx_Eevee.png";
      const nameEl = document.createElement("div"); nameEl.className="controllerName";
      wrapper.appendChild(nameEl);
      wrapper.appendChild(img);
      overlay.appendChild(wrapper);
      sessions[id]={wrapper,img,nameEl};
    }

    // Position
    wrapper.style.left = (userData.x||0) + "px";
    wrapper.style.top = (userData.y||0) + "px";

    // Size
    sessions[id].img.style.width = (userData.lynxWidth||150) + "px";

    // Accessories
    // You can add hats/glasses/coffee similarly by creating extra img elements under wrapper

    // Name
    sessions[id].nameEl.innerText = userData.controller || "";

    // Animations (example: blink)
    if(userData.blink){ sessions[id].img.style.transform="scaleY(0.1)"; setTimeout(()=>sessions[id].img.style.transform="scaleY(1)",200);}
    if(userData.bounce){ sessions[id].img.style.transform="translateY(-20px)"; setTimeout(()=>sessions[id].img.style.transform="translateY(0)",200);}
    if(userData.wiggle){ sessions[id].img.style.transform="rotate(10deg)"; setTimeout(()=>sessions[id].img.style.transform="rotate(-10deg)",100); setTimeout(()=>sessions[id].img.style.transform="rotate(0deg)",200);}
    if(userData.spin){ sessions[id].img.style.transform="rotate(360deg)"; setTimeout(()=>sessions[id].img.style.transform="rotate(0deg)",500);}
    if(userData.zoomies){ sessions[id].img.style.left=(userData.x+Math.random()*50-25)+"px"; sessions[id].img.style.top=(userData.y+Math.random()*50-25)+"px";}
  });
});
</script>
</body>
</html>
